<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime Picks - แนะนำอะนิเมะ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b1622;
  --card: #122236;
  --line: #1f3550;
  --text: #e6f1f8;
  --muted: #8fa8bd;
  --green: #34d399;
  --blue: #38bdf8;
  --heart: #fb7185;
  --grad: linear-gradient(135deg, var(--green), var(--blue));
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: "Noto Sans Thai", system-ui, sans-serif; line-height: 1.6; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.hero { position: relative; isolation: isolate; overflow: hidden; text-align: center; padding: 96px 0 64px; background: var(--bg); }
.hero-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; z-index: -2; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(11,22,34,.45), rgba(11,22,34,.78) 55%, #0b1622); pointer-events: none; }
@media (max-width: 480px) {
  .hero { padding: 64px 0 48px; }
}
.hero h1 { font-size: clamp(2.2rem, 6vw, 4rem); font-weight: 800; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: var(--muted); margin: 12px auto 28px; max-width: 520px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.btn { display: inline-block; padding: 12px 28px; border-radius: 999px; background: var(--grad); color: #062033; font-weight: 600; text-decoration: none; border: 0; cursor: pointer; font-family: inherit; font-size: 1rem; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn.ghost:hover { border-color: var(--green); color: var(--green); }
.btn.ghost[aria-pressed="true"] { border-color: var(--heart); color: var(--heart); }

.search { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 16px; }
.search input { width: min(100%, 420px); padding: 12px 20px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-family: inherit; font-size: 1rem; }
.search input::placeholder { color: var(--muted); }
.search input:focus-visible { border-color: var(--blue); outline: none; }
.count { color: var(--muted); font-size: .85rem; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0 32px; }
.filters button { padding: 8px 18px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font-family: inherit; font-size: .95rem; }
.filters button.active, .filters button:hover { border-color: var(--green); color: var(--green); }
.filters button.active { background: rgba(52,211,153,.12); }

h2 { text-align: center; margin-bottom: 20px; font-size: 1.8rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; padding-bottom: 64px; }
.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 32px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; cursor: pointer; transition: transform .2s, border-color .2s; }
.card:hover, .card:focus-visible { transform: translateY(-4px); border-color: var(--blue); }
.poster { position: relative; height: 150px; display: grid; place-items: center; font-size: 3.5rem; }
.heart { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); background: rgba(11,22,34,.55); color: #fff; font-size: 1.2rem; line-height: 1; cursor: pointer; }
.heart[aria-pressed="true"] { background: var(--heart); border-color: var(--heart); }
.info { padding: 16px; }
.info h3 { font-size: 1.05rem; }
.meta { color: var(--muted); font-size: .85rem; margin: 2px 0 8px; }
.score { color: var(--green); font-weight: 600; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .75rem; padding: 2px 10px; border-radius: 999px; background: rgba(56,189,248,.14); color: var(--blue); }

.detail { padding: 24px 0 64px; }
.back { display: inline-block; color: var(--blue); text-decoration: none; margin-bottom: 16px; }
.back:hover { text-decoration: underline; }
.d-top { display: grid; grid-template-columns: 280px 1fr; gap: 32px; align-items: start; }
.d-poster { height: 360px; border-radius: 20px; font-size: 6rem; }
.d-title { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 800; line-height: 1.25; }
.d-facts { display: flex; flex-wrap: wrap; gap: 24px; margin: 16px 0; padding: 16px 0; border-block: 1px solid var(--line); }
.d-facts dt { color: var(--muted); font-size: .8rem; }
.d-facts dd { font-size: 1.15rem; font-weight: 600; }
.detail h3 { color: var(--green); margin: 20px 0 4px; font-size: 1rem; }
.detail .actions { justify-content: flex-start; margin-top: 24px; }
.d-nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 40px 0 24px; }
.d-related { text-align: left; margin: 32px 0 16px; font-size: 1.3rem; }
@media (max-width: 720px) { .d-top { grid-template-columns: 1fr; gap: 20px; } .d-poster { height: 220px; } }

footer { text-align: center; color: var(--muted); padding: 32px 16px; border-top: 1px solid var(--line); font-size: .9rem; }
</style>
</head>

    <div class="actions">

<main class="wrap" id="list">

    why: "มุกตลกเห็นภาพแรง ๆ และเข้าใจความรู้สึกคนขี้อายได้อย่างน่ารัก" }

const FAV_KEY = "animePicks.favorites";
const FAV_FILTER = "__fav";
const ALL_FILTER = "ทั้งหมด";

const filtersEl = document.getElementById("filters");
const gridEl = document.getElementById("grid");
const detailEl = document.getElementById("detail");
const heroEl = document.getElementById("home-hero");
const listEl = document.getElementById("list");
const qEl = document.getElementById("q");
const countEl = document.getElementById("count");
const genres = [...new Set(animeList.flatMap(a => a.genres))];

let currentFilter = ALL_FILTER;
let query = "";
let openTitle = null;
let lastRandom = null;

function loadFavs() {
  try {
    const raw = JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
    return new Set(Array.isArray(raw) ? raw : []);
  } catch (e) {
    return new Set();
  }
}
let favs = loadFavs();

function saveFavs() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); } catch (e) { /* ใช้งานต่อได้แม้เก็บไม่ได้ */ }
}

function poster(a) {
  return `background:${a.colors[0]}`;
}

function slug(a) {
  return a.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

function trailerUrl(a) {
  return "https://www.youtube.com/results?search_query=" + encodeURIComponent(a.title + " official trailer");
}

function renderFilters() {
  filtersEl.innerHTML = "";
  const items = [[ALL_FILTER, ALL_FILTER], ...genres.map(g => [g, g]), [FAV_FILTER, `❤ ที่ชอบ (${favs.size})`]];
  items.forEach(([key, label]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    if (key === currentFilter) b.classList.add("active");
    b.addEventListener("click", () => { currentFilter = key; renderFilters(); renderGrid(); });
    filtersEl.appendChild(b);
  });
}

function makeCard(a) {
  const card = document.createElement("article");
  card.className = "card";
  card.tabIndex = 0;
  card.innerHTML = `
    <div class="poster" style="${poster(a)}">${a.emoji}<button class="heart" type="button"></button></div>
    <div class="info">
      <h3></h3>
      <div class="meta">${a.year} · <span class="score">★ ${a.score}</span></div>
      <div class="tags">${a.genres.map(g => `<span class="tag">${g}</span>`).join("")}</div>
    </div>`;
  card.querySelector("h3").textContent = a.title;
  const heart = card.querySelector(".heart");
  const on = favs.has(a.title);
  heart.textContent = on ? "♥" : "♡";
  heart.setAttribute("aria-pressed", on);
  heart.setAttribute("aria-label", (on ? "เอาออกจากที่ชอบ: " : "เก็บเป็นที่ชอบ: ") + a.title);
  heart.addEventListener("click", e => { e.stopPropagation(); toggleFav(a.title); });
  card.addEventListener("click", () => goTo(a));
  card.addEventListener("keydown", e => { if (e.key === "Enter" && e.target === card) goTo(a); });
  return card;
}

function goTo(a) { location.hash = "#/anime/" + slug(a); }

function renderGrid() {
  gridEl.innerHTML = "";
  const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
  const matchesQuery = a => {
    const hay = [a.title, a.year, a.genres.join(" "), a.desc, a.why].join(" ").toLowerCase();
    return terms.every(t => hay.includes(t));
  };
  const list = animeList.filter(a =>
    (currentFilter === ALL_FILTER ? true :
     currentFilter === FAV_FILTER ? favs.has(a.title) :
     a.genres.includes(currentFilter)) && matchesQuery(a));

  countEl.textContent = `พบ ${list.length} จาก ${animeList.length} เรื่อง`;

  if (!list.length) {
    const p = document.createElement("p");
    p.className = "empty";
    if (terms.length) p.textContent = `ไม่พบเรื่องที่ตรงกับ "${query.trim()}" ลองเปลี่ยนคำค้นหรือเลือกแนวอื่น`;
    else if (currentFilter === FAV_FILTER) p.textContent = "ยังไม่มีเรื่องที่ชอบ กดหัวใจที่การ์ดเพื่อเก็บ";
    else p.textContent = "ไม่พบเรื่องในแนวนี้";
    gridEl.appendChild(p);
    return;
  }

  list.forEach(a => gridEl.appendChild(makeCard(a)));
}

function toggleFav(title) {
  if (favs.has(title)) favs.delete(title); else favs.add(title);
  saveFavs();
  renderFilters();
  renderGrid();
  if (openTitle) { const y = scrollY; renderDetail(animeList.find(a => a.title === openTitle)); scrollTo(0, y); }
}

function renderDetail(a) {
  openTitle = a.title;
  const i = animeList.indexOf(a);
  const prev = animeList[(i - 1 + animeList.length) % animeList.length];
  const next = animeList[(i + 1) % animeList.length];
  const related = animeList
    .filter(b => b !== a)
    .map(b => [b, b.genres.filter(g => a.genres.includes(g)).length])
    .filter(([, n]) => n > 0)
    .sort((x, y) => y[1] - x[1] || y[0].score - x[0].score)
    .slice(0, 3).map(([b]) => b);
  const on = favs.has(a.title);
  detailEl.innerHTML = `
    <a class="back" href="#list">← กลับไปรายการทั้งหมด</a>
    <div class="d-top">
      <div class="poster d-poster" style="${poster(a)}">${a.emoji}</div>
      <div>
        <h2 class="d-title"></h2>
        <div class="tags">${a.genres.map(g => `<span class="tag">${g}</span>`).join("")}</div>
        <dl class="d-facts">
          <div><dt>ปีที่ฉาย</dt><dd>${a.year}</dd></div>
          <div><dt>คะแนน</dt><dd class="score">★ ${a.score}</dd></div>
          <div><dt>แนว</dt><dd>${a.genres.join(", ")}</dd></div>
        </dl>
        <h3>เรื่องย่อ</h3><p class="d-desc"></p>
        <h3>ทำไมถึงควรดู</h3><p class="d-why"></p>
        <div class="actions">
          <a class="btn" target="_blank" rel="noopener noreferrer" href="${trailerUrl(a)}">▶ ดูตัวอย่าง</a>
          <button class="btn ghost" id="d-fav" type="button" aria-pressed="${on}">${on ? "❤ เก็บเป็นที่ชอบแล้ว" : "♡ เก็บเป็นที่ชอบ"}</button>
        </div>
      </div>
    </div>
    <div class="d-nav">
      <a class="btn ghost" href="#/anime/${slug(prev)}"></a>
      <a class="btn ghost" href="#/anime/${slug(next)}"></a>
    </div>
    <h3 class="d-related">เรื่องที่คล้ายกัน</h3>
    <div class="grid" id="d-related"></div>`;
  detailEl.querySelector(".d-title").textContent = a.title;
  detailEl.querySelector(".d-desc").textContent = a.desc;
  detailEl.querySelector(".d-why").textContent = a.why;
  const navs = detailEl.querySelectorAll(".d-nav a");
  navs[0].textContent = "← " + prev.title;
  navs[1].textContent = next.title + " →";
  document.getElementById("d-fav").addEventListener("click", () => toggleFav(a.title));
  const rel = document.getElementById("d-related");
  related.forEach(b => rel.appendChild(makeCard(b)));
  document.title = a.title + " · Anime Picks";
}

function route() {
  const m = location.hash.match(/^#\/anime\/([a-z0-9-]+)$/);
  const a = m && animeList.find(x => slug(x) === m[1]);
  if (a) {
    heroEl.hidden = listEl.hidden = true;
    detailEl.hidden = false;
    renderDetail(a);
    scrollTo(0, 0);
  } else {
    openTitle = null;
    detailEl.hidden = true;
    heroEl.hidden = listEl.hidden = false;
    document.title = "Anime Picks - แนะนำอะนิเมะ";
    if (location.hash === "#list") listEl.scrollIntoView();
  }
}
window.addEventListener("hashchange", route);

qEl.addEventListener("input", () => { query = qEl.value; renderGrid(); });
qEl.addEventListener("keydown", e => {
  if (e.key === "Escape" && qEl.value) { qEl.value = ""; query = ""; renderGrid(); e.stopPropagation(); }
});

document.getElementById("random").addEventListener("click", () => {
  const pool = animeList.filter(a => a.title !== lastRandom);
  const pick = pool[Math.floor(Math.random() * pool.length)];
  lastRandom = pick.title;
  goTo(pick);
});

renderFilters();
renderGrid();
route();
</script>
</body>
</html>
